name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kanban
          POSTGRES_USER: kanban
          POSTGRES_PASSWORD: kanban
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kanban -d kanban"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://kanban:kanban@localhost:5432/kanban
      SECRET_KEY: test-secret
      ALLOWED_HOSTS: "*"
      DJANGO_SETTINGS_MODULE: kanban.settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Lint
        run: ruff check .
      - name: Migrate
        run: python manage.py migrate
      - name: Unit and API tests
        run: pytest -m "not e2e"
      - name: E2E tests
        run: pytest -m e2e
      - name: Docker build smoke test
        run: docker build -t rozen-kanban:test .
